plugins { id 'com.android.application' }
android {
    namespace 'com.aiworkbench.companion'
    compileSdk 35
    defaultConfig {
        applicationId 'com.aiworkbench.companion'
        minSdk 30
        targetSdk 35
        testInstrumentationRunner 'com.aiworkbench.companion.TransportTestRunner'
        versionCode 5
        versionName '0.3.2'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        preview {
            if (System.getenv('AIW_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('AIW_ANDROID_KEYSTORE'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.preview } }
}

dependencies { implementation files('libs/workbench-network.aar') }
