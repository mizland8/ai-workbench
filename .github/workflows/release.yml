# Push a version tag (for example `git tag v0.1.0 && git push origin v0.1.0`) to build installers
# for every system and attach them to a draft GitHub release. The builds are signed with the
# updater key (repository secret TAURI_SIGNING_PRIVATE_KEY), and the release gets the
# latest.json that installed copies check. They see the update once the draft is published.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build (${{ matrix.name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon only: Intel Macs are being phased out.
          - name: macOS, Apple silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: ''
          - name: Windows
            platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AI Workbench ${{ github.ref_name }}
          releaseBody: Download the installer for your system below. These builds aren't code-signed yet; the README explains how to open them the first time.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
