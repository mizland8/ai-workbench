name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-go@v5
        with:
          go-version-file: network/go.mod
          cache-dependency-path: network/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: go test ./...
        working-directory: network
      - run: npm test
      - run: npm run build

      - name: Backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint backend
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Interface tests
        if: runner.os == 'Linux'
        run: npm run test:ui

      - name: Keep interface screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: interface-screenshots
          path: e2e/screenshots
          if-no-files-found: ignore

  android:
    name: Test Android companion build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: network/go.mod
          cache-dependency-path: network/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358
      - run: bash scripts/build-android-network.sh
      - run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest lintDebug
        working-directory: mobile
